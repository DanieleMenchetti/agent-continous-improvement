<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chat-body">
  <header>
    <h1>💬 Assistant</h1>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    <nav id="mainNav">
      <a href="chat.html" class="active">Chat</a>
      <a href="feedback.html">Expert review</a>
      <a href="config.html">Config</a>
      <a href="wiki.html">Knowledge</a>
    </nav>
  </header>

  <div class="container">
    <div id="messages">
      <div class="chat-welcome" id="welcome">
        <h2>How can I help you today?</h2>
      </div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="Ask anything" rows="2"></textarea>
      <button id="send" aria-label="Send message">➤
    </div>
  </div>

  <script>
    const API = "/api";
    const sessionId = "sess-" + Math.random().toString(36).slice(2, 10);
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(text, who) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messagesEl.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
      return div;
    }

    function showTyping(el) {
      el.innerHTML =
        '<span class="typing"><span></span><span></span><span></span></span>';
    }

    async function send() {
      const question = inputEl.value.trim();
      if (!question) return;
      addMessage(question, "user");
      inputEl.value = "";
      autoGrow();
      sendBtn.disabled = true;
      const pending = addMessage("", "bot");
      showTyping(pending);
      try {
        const res = await fetch(API + "/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        pending.textContent = data.answer;
        if (data.used_context && data.used_context.length) {
          const u = document.createElement("div");
          u.className = "used";
          u.textContent = "ℹ️ Grounded in " + data.used_context.length +
            " wiki page(s): " + data.used_context.join(", ");
          pending.appendChild(u);
        }
      } catch (e) {
        pending.textContent = "⚠️ Error: " + e.message;
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    document.querySelectorAll(".chat-suggestions .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        inputEl.value = chip.textContent;
        autoGrow();
        send();
      });
    });

    document.getElementById("navToggle").addEventListener("click", () => {
      document.getElementById("mainNav").classList.toggle("open");
    });
  </script>
</body>
</html>
